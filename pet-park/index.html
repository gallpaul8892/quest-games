<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

// ---------- Scene ----------

const ARENA = 9.5;

const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpQ = new THREE.Quaternion();

// ---------- Text helpers ----------
function drawPanel(canvas, text, fontPx) {
  const g = canvas.getContext('2d');
  g.clearRect(0, 0, canvas.width, canvas.height);
  g.fillStyle = 'rgba(20,28,60,0.88)';
  g.beginPath(); g.roundRect(6, 6, canvas.width - 12, canvas.height - 12, canvas.height * 0.18); g.fill();
  g.strokeStyle = '#7f8cff'; g.lineWidth = 5; g.stroke();
  g.fillStyle = '#ffffff';
  g.font = `bold ${fontPx}px system-ui, sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, canvas.width / 2, canvas.height / 2 + fontPx * 0.04);
}
function makeTextPanel(text, w, h, fontPx, worldW) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  drawPanel(c, text, fontPx);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(worldW, worldW * h / w),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  mesh.userData.setText = (t) => { drawPanel(c, t, fontPx); tex.needsUpdate = true; };
  return mesh;
}
function makeTextSprite(text, w, h, fontPx, worldW) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  drawPanel(c, text, fontPx);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.set(worldW, worldW * h / w, 1);
  return s;
}

// ---------- Audio (all synthesised) ----------
let actx = null;
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
const audioOK = () => actx && actx.state === 'running';
const lastSnd = {};
function canPlay(type, gap) {
  const t = clock.elapsedTime;
  if ((lastSnd[type] ?? -99) + gap > t) return false;
  lastSnd[type] = t; return true;
}
const volAt = (pos) => Math.min(1, 1.8 / (1 + pos.distanceTo(playerPos)));
function env(g, t0, peak, attack, hold, release) {
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + attack);
  g.gain.setValueAtTime(peak, t0 + attack + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + hold + release);
}
function bark(vol = 1, pitch = 1) {
  if (!audioOK()) return;
  const c = actx, t = c.currentTime;
  for (let k = 0; k < 2; k++) {
    const t0 = t + k * 0.2;
    const o = c.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(430 * pitch, t0);
    o.frequency.exponentialRampToValueAtTime(150 * pitch, t0 + 0.13);
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1300;
    const g = c.createGain(); env(g, t0, 0.35 * vol, 0.012, 0, 0.15);
    o.connect(f).connect(g).connect(c.destination); o.start(t0); o.stop(t0 + 0.18);
  }
}
function yip(vol = 1, pitch = 1) {
  if (!audioOK()) return;
  const c = actx, t = c.currentTime;
  const o = c.createOscillator(); o.type = 'triangle';
  o.frequency.setValueAtTime(900 * pitch, t);
  o.frequency.exponentialRampToValueAtTime(480 * pitch, t + 0.09);
  const g = c.createGain(); env(g, t, 0.3 * vol, 0.008, 0, 0.09);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.12);
}
function meow(vol = 1, pitch = 1) {
  if (!audioOK()) return;
  const c = actx, t = c.currentTime;
  const o = c.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(520 * pitch, t);
  o.frequency.linearRampToValueAtTime(820 * pitch, t + 0.25);
  o.frequency.linearRampToValueAtTime(460 * pitch, t + 0.62);
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3;
  f.frequency.setValueAtTime(900, t);
  f.frequency.linearRampToValueAtTime(1900, t + 0.25);
  f.frequency.linearRampToValueAtTime(700, t + 0.62);
  const g = c.createGain(); env(g, t, 0.4 * vol, 0.05, 0.4, 0.2);
  o.connect(f).connect(g).connect(c.destination); o.start(t); o.stop(t + 0.7);
}
function mrrp(vol = 1, pitch = 1) {           // playful cat trill
  if (!audioOK()) return;
  const c = actx, t = c.currentTime;
  const o = c.createOscillator(); o.type = 'square';
  o.frequency.setValueAtTime(560 * pitch, t);
  o.frequency.linearRampToValueAtTime(720 * pitch, t + 0.22);
  const lfo = c.createOscillator(); lfo.frequency.value = 28;
  const lg = c.createGain(); lg.gain.value = 40;
  lfo.connect(lg).connect(o.frequency);
  const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1500;
  const g = c.createGain(); env(g, t, 0.18 * vol, 0.02, 0.15, 0.08);
  o.connect(f).connect(g).connect(c.destination);
  o.start(t); lfo.start(t); o.stop(t + 0.3); lfo.stop(t + 0.3);
}
function boing(vol = 1) {
  if (!audioOK()) return;
  const c = actx, t = c.currentTime;
  const o = c.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(260, t);
  o.frequency.exponentialRampToValueAtTime(520, t + 0.08);
  const g = c.createGain(); env(g, t, 0.15 * vol, 0.005, 0, 0.12);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.15);
}

// ---------- Particles: hearts, dust puffs, stars ----------
function canvasTex(draw) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const TEX = {
  heart: canvasTex(g => {
    g.fillStyle = '#ff4d7a'; g.beginPath(); g.moveTo(64, 112);
    g.bezierCurveTo(8, 72, 8, 18, 40, 18); g.bezierCurveTo(54, 18, 64, 30, 64, 40);
    g.bezierCurveTo(64, 30, 74, 18, 88, 18); g.bezierCurveTo(120, 18, 120, 72, 64, 112); g.fill();
  }),
  puff: canvasTex(g => {
    const gr = g.createRadialGradient(64, 64, 4, 64, 64, 60);
    gr.addColorStop(0, 'rgba(255,255,255,0.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(64, 64, 60, 0, Math.PI * 2); g.fill();
  }),
  star: canvasTex(g => {
    g.fillStyle = '#ffd84a'; g.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 22 : 58, a = i * Math.PI / 5 - Math.PI / 2;
      g.lineTo(64 + Math.cos(a) * r, 64 + Math.sin(a) * r);
    }
    g.closePath(); g.fill();
  }),
};
const particles = [];
function spawnParticle(type, pos) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX[type], transparent: true, depthWrite: false }));
  s.position.copy(pos);
  const u = { type, age: 0 };
  if (type === 'heart') { u.life = 1.3; u.size = rand(0.1, 0.15); u.vel = new THREE.Vector3(rand(-.12, .12), 0.45, rand(-.12, .12)); }
  if (type === 'puff')  { u.life = 0.6; u.size = rand(0.12, 0.2); u.vel = new THREE.Vector3(rand(-.4, .4), rand(.1, .4), rand(-.4, .4)); }
  if (type === 'star')  { u.life = 0.8; u.size = rand(0.07, 0.1); u.vel = new THREE.Vector3(rand(-.6, .6), rand(.8, 1.3), rand(-.6, .6)); }
  s.scale.setScalar(u.size);
  s.userData = u; scene.add(s); particles.push(s);
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const s = particles[i], u = s.userData;
    u.age += dt;
    s.position.addScaledVector(u.vel, dt);
    const k = u.age / u.life;
    if (u.type === 'puff') { s.scale.setScalar(u.size * (1 + k * 1.5)); s.material.opacity = 0.7 * (1 - k); }
    else if (u.type === 'star') { u.vel.y -= 2.5 * dt; s.material.rotation += dt * 6; s.material.opacity = 1 - k * k; }
    else s.material.opacity = 1 - k;
    if (u.age > u.life) { scene.remove(s); s.material.dispose(); particles.splice(i, 1); }
  }
}

// ---------- Shared geometry/material caches ----------
const geoCache = {}, matCache = {};
const G = (key, make) => geoCache[key] ??= make();
const M = (color) => matCache[color] ??= new THREE.MeshLambertMaterial({ color });
const BLACK = new THREE.MeshPhongMaterial({ color: 0x111111, shininess: 80 });
const PINK = M(0xff8fa8);

// ---------- Animals ----------
function makeAnimal({ kind, name, color, accent, x, z }) {
  const isDog = kind === 'dog';
  const s = isDog ? 1 : 0.72;
  const k = kind;
  const fur = M(color), acc = M(accent);

  const group = new THREE.Group();
  const root = new THREE.Group();
  group.add(root);

  const legH = 0.26 * s, bodyR = 0.13 * s, bodyL = 0.52 * s;

  const body = new THREE.Mesh(G(k + 'body', () => new THREE.CapsuleGeometry(bodyR, bodyL - 2 * bodyR, 6, 14)), fur);
  body.rotation.x = Math.PI / 2;
  body.position.y = legH + bodyR;
  root.add(body);

  const legs = [];
  const legGeo = G(k + 'leg', () => { const g = new THREE.CylinderGeometry(0.034 * s, 0.03 * s, legH, 8); g.translate(0, -legH / 2, 0); return g; });
  const pawGeo = G(k + 'paw', () => { const g = new THREE.SphereGeometry(0.038 * s, 8, 6); g.scale(1, 0.6, 1.3); g.translate(0, -legH, 0); return g; });
  const lx = bodyR * 0.6, lz = bodyL / 2 - bodyR * 0.75;
  for (const [px, pz] of [[lx, lz], [-lx, lz], [lx, -lz], [-lx, -lz]]) {
    const pivot = new THREE.Group();
    pivot.position.set(px, legH + 0.02 * s, pz);
    pivot.add(new THREE.Mesh(legGeo, fur), new THREE.Mesh(pawGeo, acc));
    root.add(pivot); legs.push(pivot);
  }

  const head = new THREE.Group();
  head.position.set(0, legH + bodyR * 2 + 0.03 * s, bodyL / 2 + 0.02 * s);
  root.add(head);
  const skull = new THREE.Mesh(G(k + 'skull', () => {
    const g = new THREE.SphereGeometry(0.12 * s, 18, 14); if (!isDog) g.scale(1.1, 0.95, 1); return g;
  }), fur);
  head.add(skull);
  const eyeGeo = G(k + 'eye', () => new THREE.SphereGeometry(0.021 * s, 10, 8));
  for (const sx of [-1, 1]) {
    const eye = new THREE.Mesh(eyeGeo, BLACK);
    eye.position.set(sx * 0.05 * s, 0.03 * s, 0.1 * s);
    head.add(eye);
  }
  let tongue = null;
  if (isDog) {
    const snout = new THREE.Mesh(G('dsnout', () => new THREE.BoxGeometry(0.09, 0.07, 0.1)), acc);
    snout.position.set(0, -0.025, 0.13); head.add(snout);
    const nose = new THREE.Mesh(G('dnose', () => new THREE.SphereGeometry(0.026, 10, 8)), BLACK);
    nose.position.set(0, 0, 0.18); head.add(nose);
    const earGeo = G('dear', () => { const g = new THREE.BoxGeometry(0.035, 0.13, 0.08); g.translate(0, -0.05, 0); return g; });
    for (const sx of [-1, 1]) {
      const ear = new THREE.Mesh(earGeo, acc);
      ear.position.set(sx * 0.11, 0.06, -0.01); ear.rotation.z = sx * 0.3;
      head.add(ear);
    }
    tongue = new THREE.Mesh(G('dtongue', () => new THREE.BoxGeometry(0.04, 0.012, 0.07)), PINK);
    tongue.position.set(0, -0.07, 0.15); tongue.rotation.x = 0.5; tongue.visible = false;
    head.add(tongue);
  } else {
    const muzzle = new THREE.Mesh(G('cmuzzle', () => { const g = new THREE.SphereGeometry(0.045 * s, 12, 8); g.scale(1.35, 0.8, 0.8); return g; }), acc);
    muzzle.position.set(0, -0.035 * s, 0.1 * s); head.add(muzzle);
    const nose = new THREE.Mesh(G('cnose', () => new THREE.SphereGeometry(0.016 * s, 8, 6)), PINK);
    nose.position.set(0, -0.012 * s, 0.135 * s); head.add(nose);
    const earGeo = G('cear', () => new THREE.ConeGeometry(0.05 * s, 0.11 * s, 4));
    for (const sx of [-1, 1]) {
      const ear = new THREE.Mesh(earGeo, fur);
      ear.position.set(sx * 0.07 * s, 0.115 * s, 0); ear.rotation.z = -sx * 0.3;
      head.add(ear);
    }
    const whiskers = G('cwhisk', () => {
      const pts = [];
      for (const sx of [-1, 1]) for (const dy of [-0.012, 0, 0.012])
        pts.push(new THREE.Vector3(sx * 0.04 * s, -0.03 * s, 0.12 * s), new THREE.Vector3(sx * 0.15 * s, (-0.03 + dy * 2.5) * s, 0.1 * s));
      return new THREE.BufferGeometry().setFromPoints(pts);
    });
    head.add(new THREE.LineSegments(whiskers, new THREE.LineBasicMaterial({ color: 0xffffff })));
  }

  const tail = new THREE.Group();
  tail.position.set(0, legH + bodyR * 1.6, -bodyL / 2 + 0.02 * s);
  root.add(tail);
  const tailMesh = new THREE.Mesh(G(k + 'tail', () => {
    const tl = isDog ? 0.2 : 0.34;
    const g = new THREE.CylinderGeometry(isDog ? 0.022 : 0.016, isDog ? 0.034 : 0.022, tl, 8);
    g.translate(0, tl / 2, 0); return g;
  }), fur);
  tailMesh.rotation.x = isDog ? -0.7 : -0.3;
  tail.add(tailMesh);

  const shadow = new THREE.Mesh(G(k + 'shadow', () => new THREE.CircleGeometry(0.28 * s, 16)),
    G('shadowMat', () => new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3, depthWrite: false })));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.004; shadow.scale.set(0.8, 1.4, 1);
  group.add(shadow);

  const label = makeTextSprite(`${name}: pet me!`, 512, 128, 56, 0.55);
  label.position.y = legH + bodyR * 2 + 0.38;
  label.visible = false;
  group.add(label);

  const variation = rand(0.85, 1.15);
  group.scale.setScalar(variation);
  group.position.set(x, 0, z);
  group.rotation.y = rand(0, Math.PI * 2);
  scene.add(group);

  const a = {
    kind, name, isDog, group, root, body, head, legs, tail, tongue, label,
    size: s * variation,
    mouth: new THREE.Vector3(0, -0.05, 0.19),
    speed: (isDog ? 1.1 : 0.8) * rand(0.9, 1.1), fast: (isDog ? 2.8 : 2.6) * rand(0.9, 1.1),
    voice: rand(0.8, 1.25), seed: rand(0, 100),
    mode: 'wander', target: null, idleT: rand(0, 2), zoom: false,
    curSpeed: 0, phase: rand(0, 6), petTimer: 0, heartT: 0, lastSound: -10, stroke: 0, headTilt: 0,
    ball: null, carrying: null, fight: null, followTarget: null, followT: 0, chaseT: 0, excite: 1, bats: 0, pounce: 0,
  };
  group.traverse(o => { o.userData.animal = a; });
  return a;
}

const DOG_NAMES = ['Biscuit', 'Pepper', 'Bramble', 'Scout', 'Hamish', 'Maisie', 'Bonnie', 'Archie', 'Rolo', 'Toffee', 'Murphy'];
const CAT_NAMES = ['Mochi', 'Tilly', 'Smudge', 'Willow', 'Haggis', 'Pixel', 'Clover', 'Nutmeg', 'Luna', 'Pudding', 'Socks'];
const DOG_COATS = [[0xb5763a, 0xf1dcc0], [0x2b2523, 0xc9a27a], [0xeee4d2, 0x9a7b5a], [0xd9a441, 0xf6e2b5], [0x7d7f86, 0xe9e9ea], [0x8a4b22, 0x2a1a10]];
const CAT_COATS = [[0xd9822b, 0xfbeedd], [0x6f7076, 0xd8d8dc], [0x262626, 0xf2f2f2], [0xf0f0f0, 0xffc9d1], [0xa58c6f, 0xefe3d0], [0x55504a, 0xc49a6c]];
function spawnSpot() {
  const ang = rand(0, Math.PI * 2), r = rand(2.5, 8.5);
  return { x: Math.cos(ang) * r, z: Math.sin(ang) * r };
}
const dogs = DOG_NAMES.map((name, i) => {
  const [color, accent] = DOG_COATS[i % DOG_COATS.length];
  return makeAnimal({ kind: 'dog', name, color, accent, ...spawnSpot() });
});
const cats = CAT_NAMES.map((name, i) => {
  const [color, accent] = CAT_COATS[i % CAT_COATS.length];
  return makeAnimal({ kind: 'cat', name, color, accent, ...spawnSpot() });
});
const animals = [...dogs, ...cats];

// ---------- Balls ----------
const balls = [];
function makeBall(color, stripe, r, x, y, z) {
  const mesh = new THREE.Mesh(G('ball' + r, () => new THREE.SphereGeometry(r, 16, 12)), M(color));
  const seam = new THREE.Mesh(G('seam' + r, () => new THREE.TorusGeometry(r * 1.0, r * 0.1, 4, 24)), M(stripe));
  seam.rotation.x = Math.PI / 2.4;
  mesh.add(seam);
  mesh.position.set(x, y, z);
  scene.add(mesh);
  const b = { mesh, r, vel: new THREE.Vector3(), state: 'free', thrown: false, carrier: null, hand: null, fight: null };
  balls.push(b);
  return b;
}
// tennis balls on the table
for (let i = 0; i < 4; i++) {
  const ang = i * Math.PI / 2;
  makeBall(0xc8e640, 0xffffff, 0.07, TABLE.x + Math.cos(ang) * 0.14, TABLE.top + 0.07, TABLE.z + Math.sin(ang) * 0.14);

// colourful balls around the park

    if (b.state === 'held') continue;
    const d = pos.distanceTo(ballWorld(b, tmpV2));
    if (d < bd) { bd = d; best = b; }
  }
  return best;
}
function ballOnRay(ray, maxDist) {
  let best = null, bestAlong = maxDist;
  for (const b of balls) {
    if (b.state === 'held') continue;
    ballWorld(b, tmpV2);
    const along = tmpV.copy(tmpV2).sub(ray.origin).dot(ray.direction);
    if (along < 0 || along > bestAlong) continue;
    const tol = 0.12 + along * 0.04;
    if (ray.distanceSqToPoint(tmpV2) < tol * tol) { bestAlong = along; best = b; }
  }
  return best;
}

function pet(a, ctrlIndex, stroking) {
  if (a.fight && a.fight.phase === 'tussle') resolveFight(a.fight);   // a pat breaks up the scuffle
  const fresh = a.petTimer <= 0;
  a.petTimer = 2.2;
  if (fresh) { a.heartT = 0; stats.pets++; updateScore(); }
  const t = clock.elapsedTime;
  if (t - a.lastSound > 1.6 && canPlay(a.isDog ? 'bark' : 'meow', 0.4)) {
    a.lastSound = t;
    a.group.getWorldPosition(tmpV2);
    (a.isDog ? bark : meow)(volAt(tmpV2), a.voice);
  }
  haptic(ctrlIndex, stroking ? 0.25 : 0.6, stroking ? 40 : 90);
}

// ---------- VR controllers ----------
const controllers = [], grips = [], xrSources = [null, null];
const factory = new XRControllerModelFactory();
function haptic(i, strength, ms) {
  const h = xrSources[i]?.gamepad?.hapticActuators?.[0];
  if (h?.pulse) h.pulse(strength, ms);
}
const ctrlRay = new THREE.Ray();
function controllerRay(i) {
  controllers[i].getWorldPosition(ctrlRay.origin);
  controllers[i].getWorldQuaternion(tmpQ);
  ctrlRay.direction.set(0, 0, -1).applyQuaternion(tmpQ);
  return ctrlRay;
}
function handVelocity(i) {
  const h = hands[i].hist;
  if (h.length < 2) return new THREE.Vector3();
  let dtSum = 0;
  for (let k = 1; k < h.length; k++) dtSum += h[k].dt;
  return h[h.length - 1].p.clone().sub(h[0].p).divideScalar(Math.max(dtSum, 1e-3));
}

for (let i = 0; i < 2; i++) {
  const ctrl = renderer.xr.getController(i);
  ctrl.addEventListener('connected', e => { xrSources[i] = e.data; });
  ctrl.addEventListener('disconnected', () => { xrSources[i] = null; });
  const press = (btn) => () => {
    const h = hands[i];
    if (h.ball) return;
    grips[i].getWorldPosition(tmpV);
    let b = ballNear(tmpV, 0.28);
    if (!b) {
      const a = animalNear(tmpV, 0.6);
      if (a) { pet(a, i, false); return; }
      b = ballOnRay(controllerRay(i), 12);   // point at a ball and it flies to your hand
    }
    if (b) { grabBall(b, i); h.btn = btn; haptic(i, 0.4, 50); return; }
    if (btn === 'select') cube.material.color.setHSL(Math.random(), 0.8, 0.55);
  };
  const release = (btn) => () => {
    const h = hands[i];
    if (h.ball && h.btn === btn) {
      const v = handVelocity(i).multiplyScalar(1.4);
      if (v.length() > 16) v.setLength(16);
      throwBall(h.ball, v);
      h.ball = null; h.btn = null;
    }
  };
  ctrl.addEventListener('selectstart', press('select'));
  ctrl.addEventListener('squeezestart', press('squeeze'));
  ctrl.addEventListener('selectend', release('select'));
  ctrl.addEventListener('squeezeend', release('squeeze'));
  const ray = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0x9fb0ff, transparent: true, opacity: 0.5 })
  );
  ray.scale.z = 3;
  ctrl.add(ray);
  dolly.add(ctrl); controllers.push(ctrl);

  const grip = renderer.xr.getControllerGrip(i);
  grip.add(factory.createControllerModel(grip));
  dolly.add(grip); grips.push(grip);
}
renderer.xr.addEventListener('sessionstart', () => audio());

const prevHand = [new THREE.Vector3(), new THREE.Vector3()], hasPrev = [false, false];
function updateHands(dt) {
  for (let i = 0; i < 2; i++) {
    if (!xrSources[i]) { hasPrev[i] = false; hands[i].hist.length = 0; continue; }
    grips[i].getWorldPosition(tmpV);
    const hist = hands[i].hist;
    hist.push({ p: tmpV.clone(), dt });
    if (hist.length > 6) hist.shift();
    // stroking a pet with an empty hand
    if (hasPrev[i] && dt > 0 && !hands[i].ball) {
      const v = tmpV.distanceTo(prevHand[i]) / dt;
      const a = animalNear(tmpV, 0.35);
      if (a && v > 0.2) {
        a.stroke += dt;
        if (a.stroke > 0.2) { a.stroke = 0; pet(a, i, true); }
      }
    }
    prevHand[i].copy(tmpV); hasPrev[i] = true;
  }
}

let snapReady = true;
function updateXRLocomotion(dt) {
  const session = renderer.xr.getSession();
  if (!session) return;
  for (const src of session.inputSources) {
    const gp = src.gamepad;
    if (!gp || gp.axes.length < 4) continue;
    const ax = gp.axes[2], ay = gp.axes[3];
    if (src.handedness === 'left') {
      if (Math.abs(ax) > 0.15 || Math.abs(ay) > 0.15) {
        camera.getWorldDirection(tmpV); tmpV.y = 0; tmpV.normalize();
        tmpV2.crossVectors(tmpV, UP).normalize();
        dolly.position.addScaledVector(tmpV, -ay * 2 * dt);
        dolly.position.addScaledVector(tmpV2, ax * 2 * dt);
      }
    } else if (src.handedness === 'right') {
      if (Math.abs(ax) > 0.7 && snapReady) {
        snapReady = false;
        const angle = -Math.sign(ax) * Math.PI / 6;
        camera.getWorldPosition(tmpV);
        dolly.position.sub(tmpV).applyAxisAngle(UP, angle).add(tmpV);
        dolly.rotation.y += angle;
      } else if (Math.abs(ax) < 0.3) snapReady = true;
    }
  }
}

// ---------- Desktop controls ----------
let yaw = 0, pitch = -0.2;
const keys = new Set();
addEventListener('keydown', e => keys.add(e.code));
addEventListener('keyup', e => keys.delete(e.code));
let dragging = false, dragMoved = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  audio(); dragging = true; dragMoved = false; lastX = e.clientX; lastY = e.clientY;
});
addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
  yaw -= dx * 0.004; pitch = Math.max(-1.3, Math.min(1.3, pitch - dy * 0.004));
  lastX = e.clientX; lastY = e.clientY;
});
const raycaster = new THREE.Raycaster();
addEventListener('pointerup', e => {
  const wasClick = dragging && !dragMoved;
  dragging = false;
  if (!wasClick || renderer.xr.isPresenting) return;
  if (deskBall) {
    camera.getWorldDirection(tmpV);
    const b = deskBall; deskBall = null;
    throwBall(b, tmpV.multiplyScalar(9).add(new THREE.Vector3(0, 2.5, 0)));
    return;
  }
  raycaster.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  const b = ballOnRay(raycaster.ray, 4);
  const hit = raycaster.intersectObjects(animals.map(a => a.group), true).find(h => h.object.userData.animal && !h.object.isSprite);
  const ballDist = b ? ballWorld(b, tmpV).distanceTo(raycaster.ray.origin) : Infinity;
  if (b && (!hit || ballDist < hit.distance + 0.2)) { grabBall(b, -1); return; }
  if (hit && hit.distance < 2.6) pet(hit.object.userData.animal, -1, false);
});
function updateDesktop(dt) {
  camera.rotation.set(pitch, yaw, 0);
  const f = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
  const r = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
  if (f || r) {
    const sp = 2.4 * dt;
    dolly.position.x += (-Math.sin(yaw) * f + Math.cos(yaw) * r) * sp;
    dolly.position.z += (-Math.cos(yaw) * f - Math.sin(yaw) * r) * sp;
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Main loop ----------
updateScore();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (renderer.xr.isPresenting) { updateXRLocomotion(dt); updateHands(dt); }
  else updateDesktop(dt);

  const pr = Math.hypot(dolly.position.x, dolly.position.z);
  if (pr > 12) { dolly.position.x *= 12 / pr; dolly.position.z *= 12 / pr; }
  camera.getWorldPosition(playerPos);

  director(dt);
  updateFights(dt);
  for (const a of animals) updateAnimal(a, dt, t, playerPos);
  separateAnimals();
  updateBalls(dt);
  updateParticles(dt);

  cube.rotation.x = t * 0.7; cube.rotation.y = t * 1.1;
  hello.position.y = 2.1 + Math.sin(t * 1.5) * 0.03;

  renderer.render(scene, camera);
});
</script>
</body>
