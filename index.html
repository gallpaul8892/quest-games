<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest Games</title>
<style>
  body { margin: 0; min-height: 100vh; background: #0b1020; color: #e8ecff; font-family: system-ui, sans-serif; display: grid; place-items: center; }
  main { max-width: 560px; padding: 24px; }
  a.game { display: block; padding: 20px 24px; margin: 12px 0; border: 2px solid #7f8cff; border-radius: 16px; color: #fff; text-decoration: none; background: #141c3c; font-size: 22px; font-weight: 700; }
  a.game span { display: block; font-size: 15px; font-weight: 400; opacity: .8; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>Quest Games</h1>
  <p>Open this page in the Meta Quest Browser, pick a game, then tap “Enter VR”.</p>
  <a class="game" href="pet-park/">Pet Park<span>Choose up to 20 dogs and 20 cats. Pet them, watch the cats play-scuffle, and throw balls for the dogs to fetch.</span></a>
</main>
</body>
</html>
